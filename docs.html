<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoGO — Техническая документация</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap">
    <link rel="stylesheet" href="style.css">
    <style>
        .doc-row { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 0.9rem 1.1rem; margin-bottom: 0.6rem; cursor: pointer; transition: 0.2s; }
        .doc-row:hover { border-color: var(--accent-hover); }
        .doc-content { white-space: pre-wrap; line-height: 1.6; }
        .doc-content h1 { font-size: 1.4rem; margin-bottom: 0.8rem; }
    </style>
</head>
<body>
<header>
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="index.html"><i class="bi bi-car-front"></i> AutoGO</a>
        </div>
    </nav>
</header>

<main class="container my-4">
    <h2 class="mb-3"><i class="bi bi-journal-text"></i> Техническая документация</h2>
    <div class="autogo-page-card mb-3">
        <div class="row g-2">
            <div class="col-md-3">
                <select class="form-select" id="filterBrand"><option value="">Все марки</option></select>
            </div>
            <div class="col-md-3">
                <select class="form-select" id="filterCategory">
                    <option value="">Все категории</option>
                    <option value="regulation">Регламент ТО</option>
                    <option value="manual">Мануал</option>
                    <option value="diagram">Схема</option>
                </select>
            </div>
            <div class="col-md-6">
                <input class="form-control" id="filterQuery" placeholder="Поиск по тексту...">
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-md-5">
            <div id="docsList"><div class="text-center py-5"><div class="spinner-border text-purple"></div></div></div>
        </div>
        <div class="col-md-7">
            <div id="docDetail" class="autogo-page-card autogo-empty-state">Выберите документ слева</div>
        </div>
    </div>
</main>

<footer class="border-top mt-5 py-4 text-center text-secondary small">© 2025 AutoGO</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="nav.js"></script>
<script src="docs.js"></script>
</body>
</html>
