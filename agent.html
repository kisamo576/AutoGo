<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoGO — Помощник поиска</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap">
    <link rel="stylesheet" href="style.css">
    <style>
        .result-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 1rem; margin-bottom: 0.7rem; }
        .result-source { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; }
        .community-chip { background: var(--surface-sunken); border-radius: 14px; padding: 0.6rem 0.8rem; display: inline-block; margin: 0.2rem; }
    </style>
</head>
<body>
<header>
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="index.html"><i class="bi bi-car-front"></i> AutoGO</a>
        </div>
    </nav>
</header>

<main class="container my-4">
    <h2 class="mb-1"><i class="bi bi-search"></i> Помощник поиска по форумам</h2>
    <p class="text-secondary mb-3">Опишите проблему или вопрос — агент подберёт релевантную информацию и подскажет, на каких форумах искать дальше.</p>

    <div class="autogo-page-card">
        <form id="searchForm">
            <div class="row g-2">
                <div class="col-md-3"><input class="form-control" id="agentBrand" placeholder="Марка (необязательно)"></div>
                <div class="col-md-3"><input class="form-control" id="agentModel" placeholder="Модель (необязательно)"></div>
                <div class="col-md-6"><input class="form-control" id="agentQuery" placeholder="Например: стук в подвеске на кочках" required></div>
            </div>
            <button type="submit" class="btn btn-purple mt-3" id="searchSubmitBtn"><i class="bi bi-search"></i> Искать</button>
        </form>
    </div>

    <div id="agentOutput" class="mt-3"></div>
</main>

<footer class="border-top mt-5 py-4 text-center text-secondary small">© 2025 AutoGO</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="nav.js"></script>
<script src="agent.js"></script>
</body>
</html>
