<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AutoGO — Подать объявление</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap">
    <link rel="stylesheet" href="style.css">
    <style>
        .form-card {
            background: var(--surface);
            border-radius: 28px;
            border: 1px solid var(--border);
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }
        .form-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            margin-bottom: 0.3rem;
        }
        .form-control, .form-select {
            background: var(--surface-sunken);
            border: 1px solid var(--border);
            border-radius: 14px;
            color: var(--text);
        }
        .form-control:focus, .form-select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(139,92,246,0.2);
        }
    </style>
</head>
<body>
<header>
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="index.html"><i class="bi bi-car-front"></i> AutoGO</a>
            <div class="ms-auto d-flex gap-2">
                <button class="btn btn-outline-purple btn-sm" onclick="alert('Часто задаваемые вопросы')">Помощь</button>
                <a href="javascript:history.back()" class="back-link"><i class="bi bi-arrow-left"></i> Назад</a>
            </div>
        </div>
    </nav>
</header>

<main class="container my-4">
    <div class="form-card p-3 p-lg-4">
        <h2 id="listingFormTitle" class="fw-bold mb-3">Подать объявление</h2>
        <form id="addAdForm">
            <fieldset id="listingFields" disabled>
                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label for="listingBrand" class="form-label">Марка</label>
                        <select id="listingBrand" class="form-select" required>
                            <option value="">Выберите марку</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label for="listingModel" class="form-label">Модель</label>
                        <select id="listingModel" name="model_id" class="form-select" required></select>
                    </div>
                    <div class="col-md-4">
                        <label for="listingYear" class="form-label">Год выпуска</label>
                        <input id="listingYear" name="year" type="number" class="form-control" min="1900" required>
                    </div>
                    <div class="col-md-4">
                        <label for="listingPrice" class="form-label">Цена ($)</label>
                        <input id="listingPrice" name="price" type="number" class="form-control" min="1" max="10000000" required>
                    </div>
                    <div class="col-md-4">
                        <label for="listingMileage" class="form-label">Пробег (км)</label>
                        <input id="listingMileage" name="mileage" type="number" class="form-control" min="0" max="3000000" required>
                    </div>
                </div>
                <p id="listingModelDetails" class="small text-secondary"></p>
                <label for="listingDescription" class="form-label">Описание автомобиля</label>
                <textarea id="listingDescription" name="description" class="form-control mb-3" rows="5" maxlength="2000" required></textarea>
                <button id="saveListing" type="submit" class="btn btn-purple">Опубликовать объявление</button>
            </fieldset>
        </form>
        <p id="listingFormMessage" class="mt-3 small" role="status">Проверяем авторизацию…</p>
        <a href="profile.html#my-ads" class="btn btn-sm btn-outline-purple">Мои объявления</a>
    </div>
</main>

<footer class="border-top mt-5 py-4 text-center text-secondary small">© 2025 AutoGO</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="nav.js"></script>
<script src="cars.js"></script>
<script src="listing-form.js"></script>
</body>
</html>
