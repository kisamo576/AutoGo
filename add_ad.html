<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>AutoGO — Подать объявление</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .form-card {
            background: #1E293B;
            border-radius: 28px;
            border: 1px solid #334155;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }
        .photo-placeholder {
            background: #0F172A;
            border: 2px dashed #475569;
            border-radius: 20px;
            height: 200px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.2s;
        }
        .photo-placeholder:hover {
            border-color: #8B5CF6;
            background: #1E293B;
        }
        .photo-placeholder i {
            font-size: 3rem;
            color: #64748B;
        }
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #1E293B;
            padding: 0.5rem 1rem;
            border-radius: 40px;
            text-decoration: none;
            color: #CBD5E1;
            transition: 0.2s;
        }
        .back-link:hover {
            background: #334155;
            color: white;
        }
        .btn-danger-custom {
            background: #DC2626;
            box-shadow: 0 2px 8px rgba(220,38,38,0.4);
            color: white;
        }
        .btn-danger-custom:hover {
            background: #B91C1C;
            transform: translateY(-1px);
        }
        .form-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #94A3B8;
            margin-bottom: 0.3rem;
        }
        .form-control, .form-select {
            background: #0F172A;
            border: 1px solid #334155;
            border-radius: 14px;
            color: #F1F5F9;
        }
        .form-control:focus, .form-select:focus {
            border-color: #8B5CF6;
            box-shadow: 0 0 0 3px rgba(139,92,246,0.2);
        }
        .spec-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 0.8rem;
        }
        @media (max-width: 768px) {
            .photo-placeholder { height: 150px; }
        }
    </style>
</head>
<body>
<header>
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="index.html"><i class="bi bi-car-front"></i> AutoGO</a>
            <div class="ms-auto d-flex gap-2">
                <button class="btn btn-outline-purple btn-sm" onclick="alert('Часто задаваемые вопросы')">Помощь</button>
                <a href="javascript:history.back()" class="back-link"><i class="bi bi-arrow-left"></i> Назад</a>
            </div>
        </div>
    </nav>
</header>

<main class="container my-4">
    <div class="form-card">
        <div class="row g-0">
            <!-- Левая колонка: фото + заглушка -->
            <div class="col-lg-5">
                <div class="p-3 p-lg-4">
                    <div class="photo-placeholder" onclick="alert('Выберите фото автомобиля (функция в разработке)')">
                        <i class="bi bi-plus-circle"></i>
                        <p class="mt-2 mb-0 text-secondary">Добавить фото</p>
                        <small class="text-secondary">PNG, JPG до 5MB</small>
                    </div>
                    <div class="mt-3 text-center">
                        <small class="text-secondary">Фотография не обязательна, но повышает шансы продажи</small>
                    </div>
                </div>
            </div>
            
            <!-- Правая колонка: форма -->
            <div class="col-lg-7">
                <div class="p-3 p-lg-4">
                    <h2 class="fw-bold mb-3">Подать объявление</h2>
                    <p class="text-secondary small mb-4">Заполните информацию об автомобиле</p>
                    
                    <form id="addAdForm" onsubmit="event.preventDefault(); alert('Объявление отправлено на модерацию! (демо)'); this.reset();">
                        <!-- Марка и модель -->
                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Марка</label>
                                <select id="adBrandSelect" class="form-select" required>
                                    <option value="">Выберите марку</option>
                                    <option value="BMW">BMW</option>
                                    <option value="Mercedes">Mercedes-Benz</option>
                                    <option value="Audi">Audi</option>
                                    <option value="Toyota">Toyota</option>
                                    <option value="Hyundai">Hyundai</option>
                                    <option value="Kia">Kia</option>
                                    <option value="Volkswagen">Volkswagen</option>
                                    <option value="Volvo">Volvo</option>
                                    <option value="Lexus">Lexus</option>
                                    <option value="Porsche">Porsche</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Модель</label>
                                <input type="text" id="adModelInput" class="form-control" placeholder="Например: X5" required>
                            </div>
                        </div>
                        
                        <!-- Год и цена -->
                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Год выпуска</label>
                                <select id="adYearSelect" class="form-select" required>
                                    <option value="">Выберите год</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Цена ($)</label>
                                <input type="number" id="adPrice" class="form-control" min="1000" step="500" placeholder="Например: 25000" required>
                            </div>
                        </div>
                        
                        <!-- Двигатель и пробег -->
                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Объём двигателя (л)</label>
                                <input type="number" id="adEngine" class="form-control" min="0.8" step="0.1" placeholder="Например: 2.0" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Пробег (км)</label>
                                <input type="number" id="adMileage" class="form-control" min="0" step="1000" placeholder="Например: 45000" required>
                            </div>
                        </div>
                        
                        <!-- Дополнительные параметры (сетка) -->
                        <div class="spec-grid mb-3">
                            <div>
                                <label class="form-label">Тип кузова</label>
                                <select id="adBodyType" class="form-select">
                                    <option value="Седан">Седан</option>
                                    <option value="Внедорожник / SUV">Внедорожник / SUV</option>
                                    <option value="Хэтчбек">Хэтчбек</option>
                                    <option value="Универсал">Универсал</option>
                                    <option value="Купе">Купе</option>
                                </select>
                            </div>
                            <div>
                                <label class="form-label">Привод</label>
                                <select id="adDrive" class="form-select">
                                    <option value="Передний">Передний</option>
                                    <option value="Задний">Задний</option>
                                    <option value="Полный (4WD/AWD)">Полный (4WD/AWD)</option>
                                </select>
                            </div>
                            <div>
                                <label class="form-label">Коробка передач</label>
                                <select id="adTransmission" class="form-select">
                                    <option value="Механика">Механика</option>
                                    <option value="Автомат">Автомат</option>
                                    <option value="Робот / CVT">Робот / CVT</option>
                                </select>
                            </div>
                            <div>
                                <label class="form-label">Цвет</label>
                                <select id="adColor" class="form-select">
                                    <option value="Чёрный">Чёрный</option>
                                    <option value="Белый">Белый</option>
                                    <option value="Серебристый">Серебристый</option>
                                    <option value="Красный">Красный</option>
                                    <option value="Синий">Синий</option>
                                    <option value="Серый">Серый</option>
                                </select>
                            </div>
                            <div>
                                <label class="form-label">Состояние</label>
                                <select id="adCondition" class="form-select">
                                    <option value="С пробегом">С пробегом</option>
                                    <option value="Новый">Новый</option>
                                </select>
                            </div>
                        </div>
                        
                        <!-- Описание -->
                        <div class="mb-4">
                            <label class="form-label">Описание автомобиля</label>
                            <textarea id="adDescription" class="form-control" rows="4" placeholder="Расскажите о состоянии, комплектации, особенностях..." required></textarea>
                        </div>
                        
                        <!-- Кнопки -->
                        <div class="d-flex gap-3">
                            <button type="submit" class="btn btn-purple flex-grow-1">
                                <i class="bi bi-check-circle"></i> Опубликовать объявление
                            </button>
                            <button type="button" class="btn btn-outline-purple" onclick="history.back()">
                                <i class="bi bi-x-circle"></i> Отмена
                            </button>
                        </div>
                        <div class="mt-3 text-center">
                            <small class="text-secondary">После публикации объявление появится в каталоге и на главной странице</small>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<footer class="border-top mt-5 py-4 text-center text-secondary small">© 2025 AutoGO</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Заполнение годов (от 1980 до 2026)
    const yearSelect = document.getElementById('adYearSelect');
    for (let y = 2026; y >= 1980; y--) {
        const option = document.createElement('option');
        option.value = y;
        option.textContent = y;
        yearSelect.appendChild(option);
    }
</script>
</body>
</html>
