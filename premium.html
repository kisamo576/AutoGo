<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>AutoGO — Премиум доступ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap">
    <link rel="stylesheet" href="style.css">
    <style>
        .premium-page-card {
            background: var(--surface);
            border-radius: 28px;
            border: 1px solid var(--border);
            overflow: hidden;
        }
    </style>
</head>
<body>
<header>
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="index.html"><i class="bi bi-car-front"></i> AutoGO</a>
            <a href="javascript:history.back()" class="back-link"><i class="bi bi-arrow-left"></i> Назад</a>
        </div>
    </nav>
</header>

<main class="container my-4">
    <div class="premium-page-card">
        <div class="p-4 p-lg-5">
            <h1 class="fw-bold"><i class="bi bi-star-fill text-warning"></i> Премиум</h1>
            <p class="text-secondary">Активируйте демо-статус на 30 дней. Оплата не требуется.</p>
            <p id="premiumStatus" class="mb-3" role="status">Проверяем статус…</p>
            <button class="btn btn-warning fw-bold" id="buyPremiumBtn" type="button" disabled>
                Активировать на 30 дней
            </button>
        </div>
    </div>
</main>

<footer class="border-top mt-5 py-4 text-center text-secondary small">© 2025 AutoGO</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="nav.js"></script>
<script src="premium.js"></script>
</body>
</html>
